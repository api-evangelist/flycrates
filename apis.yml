aid: flycrates
name: Flycrates
description: Flycrates is an international shipping service, founded in 2015 and headquartered
  in San Francisco, that lets shoppers outside the United States buy US Amazon.com Prime
  items and have them delivered worldwide. Instead of filling an Amazon cart, customers
  fill a fixed-size crate (small, medium, or large); Flycrates then purchases the items,
  consolidates them, clears customs, and pays import duty and tax on the buyer's behalf
  before shipping via DHL, FedEx, or UPS to more than 117 countries. It also offers a
  Chrome browser extension that adds "Add to Flycrates" buttons directly onto Amazon
  product pages. Flycrates raised a seed round led by 500 Global. As of this enrichment
  pass the company operates a consumer web application only and exposes no public API,
  developer portal, or partner integration program.
